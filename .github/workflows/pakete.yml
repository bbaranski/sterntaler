# Baut die startfertigen Programmversionen fuer macOS und Windows.
#
# jpackage kann nicht quer uebersetzen: Ein Windows-Paket entsteht nur auf Windows, ein
# macOS-Paket nur auf macOS. Deshalb laeuft der Bau hier je Zielsystem auf einem eigenen
# Laeufer - das ist der Grund fuer diesen Workflow.
#
# Dazu kommt EIN plattformuebergreifendes Jar fuer Windows und Apple-Silicon-Macs, das ein
# installiertes Java 21 voraussetzt. Es wird nur einmal gebaut und zusammen mit den
# Startskripten als ZIP ausgeliefert.
#
# Starten: Actions -> "Programmpakete" -> "Run workflow". Bei einem Tag v* entsteht
# zusaetzlich ein Release mit den Dateien im Anhang.
name: Programmpakete

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  paket:
    name: ${{ matrix.bezeichnung }}
    runs-on: ${{ matrix.laeufer }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - laeufer: macos-latest
            bezeichnung: macOS (Apple Silicon)
            artefakt: Sterntaler-macOS-arm64
          - laeufer: macos-13
            bezeichnung: macOS (Intel)
            artefakt: Sterntaler-macOS-x86_64
          - laeufer: windows-latest
            bezeichnung: Windows
            artefakt: Sterntaler-Windows

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Baut das Uber-Jar und laesst dabei die Tests laufen - auch die beiden Waechter, die
      # Handbuch und Programm zusammenhalten.
      - name: Bauen und testen
        run: mvn -B clean package

      # Das passende Profil (mac-aarch64, mac-x86_64, windows) waehlt Maven selbst anhand von
      # Betriebssystem und Architektur des Laeufers.
      - name: Paket schnueren
        run: mvn -B jpackage:jpackage

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefakt }}
          path: target/dist/*
          if-no-files-found: error

  uberjar:
    name: Plattformuebergreifendes Jar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Das -D gehoert zwingend dazu: Die OpenJFX-POMs waehlen den Classifier ihrer transitiven
      # Artefakte ueber eigene os-Profile, also nach dem Laeufer. Ohne die Festlegung zoege ein
      # fremder Laeufer einen dritten Plattformsatz herein.
      - name: Jar bauen und testen
        run: mvn -B clean package -Pplattformuebergreifend -Djavafx.platform=mac-aarch64

      # Ein Archiv statt dreier Einzeldateien: Nur so behaelt start.command sein
      # Ausfuehrbar-Bit und laesst sich auf dem Zielrechner doppelklicken.
      - name: Archiv schnueren
        run: |
          mkdir -p paket
          cp target/plattformuebergreifend/Sterntaler.jar paket/
          cp -p start/start.command start/start.bat start/LIESMICH.txt paket/
          # Lizenz und Drittanbieter-Hinweise stecken auch im Jar; hier noch einmal offen
          # daneben, damit sie ohne Auspacken des Jars lesbar sind.
          cp LICENSE DRITTANBIETER.md paket/
          cd paket && zip -X -r ../Sterntaler-Windows-und-Mac.zip .

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Sterntaler-Windows-und-Mac
          path: Sterntaler-Windows-und-Mac.zip
          if-no-files-found: error

  release:
    name: Release anlegen
    needs: [paket, uberjar]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete

      - name: Dateien an das Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes $(find pakete -type f)
